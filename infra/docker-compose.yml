version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bluelink-db
    environment:
      POSTGRES_USER: bluelink_user
      POSTGRES_PASSWORD: bluelink_password
      POSTGRES_DB: bluelink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluelink_user -d bluelink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bluelink-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: bluelink-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bluelink-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend1:
    build: /Users/subbu52310/antigravity/FLYNK---Creator-Video-&-Commerce-Ecosystem/BlueLink/backend
    container_name: bluelink-backend1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://bluelink_user:bluelink_password@db:5432/bluelink_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  backend2:
    build: /Users/subbu52310/antigravity/FLYNK---Creator-Video-&-Commerce-Ecosystem/BlueLink/backend
    container_name: bluelink-backend2
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql://bluelink_user:bluelink_password@db:5432/bluelink_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: /Users/subbu52310/antigravity/FLYNK---Creator-Video-&-Commerce-Ecosystem/BlueLink/backend
    container_name: bluelink-worker
    command: celery -A app.workers.transcoder.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://bluelink_user:bluelink_password@db:5432/bluelink_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  bluelink-lb:
    image: nginx:alpine
    container_name: bluelink-lb
    volumes:
      - /Users/subbu52310/antigravity/FLYNK---Creator-Video-&-Commerce-Ecosystem/BlueLink/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2

  frontend:
    build: /Users/subbu52310/antigravity/FLYNK---Creator-Video-&-Commerce-Ecosystem/BlueLink/frontend
    container_name: bluelink-frontend
    ports:
      - "80:80"
    depends_on:
      - bluelink-lb

volumes:
  postgres_data:
  minio_data:
